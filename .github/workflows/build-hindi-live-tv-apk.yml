name: Build Hindi Live TV Fire TV APK
# Rebuild after full-screen playback and global IPTV index integration.

on:
  push:
    branches: [hindi-live-tv-firetv]
    paths:
      - "hindi-live-tv-firetv/**"
      - ".github/workflows/build-hindi-live-tv-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build native APK
        run: gradle -p hindi-live-tv-firetv assembleDebug --no-daemon

      - name: Verify APK archive and DEX
        shell: bash
        run: |
          APK="hindi-live-tv-firetv/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'classes([0-9]+)?\.dex'
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 100000

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hindi-Live-TV-Fire-TV-APK
          path: hindi-live-tv-firetv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK="hindi-live-tv-firetv/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" Hindi-Live-TV-Fire-TV.apk
          if ! gh release view hindi-live-tv-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create hindi-live-tv-latest --repo "$GITHUB_REPOSITORY" \
              --title "Hindi Live TV for Fire TV" \
              --notes "Standalone native Android TV app. Built and archive-checked by GitHub Actions. Playback depends on each public stream source."
          fi
          gh release upload hindi-live-tv-latest Hindi-Live-TV-Fire-TV.apk --repo "$GITHUB_REPOSITORY" --clobber
