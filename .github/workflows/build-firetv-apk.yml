name: Build Arcade Orbit Android APKs

on:
  push:
    branches: [main]
    paths:
      - "firetv/**"
      - "index.html"
      - ".github/workflows/build-firetv-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android APK
        working-directory: firetv
        run: gradle assembleDebug --no-daemon

      - name: Verify APK archive and DEX
        run: |
          APK="firetv/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'classes([0-9]+)?\.dex'
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 10000

      - name: Prepare release assets
        run: |
          cp firetv/app/build/outputs/apk/debug/app-debug.apk ArcadeOrbit.apk
          cp firetv/app/build/outputs/apk/debug/app-debug.apk ArcadeOrbit-Mobile.apk

      - name: Publish verified APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view firetv-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create firetv-latest --repo "${GITHUB_REPOSITORY}" \
              --title "Arcade Orbit Android App" \
              --notes "Arcade Orbit WebView app for Android phones and Fire TV. Requires internet access."
          fi
          gh release upload firetv-latest ArcadeOrbit.apk ArcadeOrbit-Mobile.apk --repo "${GITHUB_REPOSITORY}" --clobber
